translate_structure:
  fields:
    data:
      example: '{"title": "Welcome", "items": ["Open", "Close"]}'
      selector:
        object:
    input_file:
      example: "/config/custom_components/my_integration/translations/en.json"
      selector:
        text:
    output_file:
      example: "/config/custom_components/my_integration/translations/de.json"
      selector:
        text:
    format:
      default: auto
      selector:
        select:
          mode: dropdown
          options: [auto, json, yaml]
    only_keys:
      example: '["name", "title", "message"]'
      selector:
        text:
          multiple: true
    ignore_keys:
      example: '["id", "icon"]'
      selector:
        text:
          multiple: true
    skip_technical_values:
      default: true
      selector:
        boolean:
    protect_placeholders:
      default: true
      selector:
        boolean:
    dry_run:
      default: false
      selector:
        boolean:
    overwrite:
      default: false
      selector:
        boolean:
    target_language:
      example: "de"
      selector:
        select:
