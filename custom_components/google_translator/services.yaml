get_languages:
  fields:
    type:
      default: target
      selector:
        select:
          mode: dropdown
          options: [target, source]
    config_entry_id:
      selector:
        config_entry:
          integration: google_translator

get_usage:
  fields:
    refresh:
      default: false
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: google_translator
